# JointCMBLikelihoods data artifacts.
# Converted release data for the joint Planck PR4 + ACT DR6 + SPT-3G D1
# likelihood (arXiv:2511.04733). Download URLs live only here.
#
# Archives are .tar.xz (Zenodo convention), with the contents at the archive
# ROOT: Julia hashes the extracted tree, so a wrapping top-level directory
# changes the hash and fails the integrity check. Tree hashes computed over the
# uncompressed tarball (Tar.tree_hash).
#
# STATUS: all five artifacts are published and each has been resolved from a
# clean depot against its live URL. The three re-archived in September 2026 kept
# their original `git-tree-sha1` (content-derived) but carry new `sha256` values,
# because their first archives no longer existed and tar/xz cannot reproduce a
# file byte for byte.

# Published: https://doi.org/10.5281/zenodo.22840060 (record 22840060).
# Concept DOI 10.5281/zenodo.22840059 always resolves to the latest version.
# Frozen reference fixtures for the test suite. The unreferenced `invkll` array
# (20 identical 90.55 MiB copies) was removed before archiving; it is regenerable
# with validation/convert_planck_data.py.
